name: Customer skills

on:
  pull_request:
    paths:
      - 'skills/agentgateway-enterprise-*/**'
      - 'skills/istio-*/**'
      - 'skills/catalog.json'
      - 'scripts/refresh-skill-metadata.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/refresh-skill-metadata.py --check
